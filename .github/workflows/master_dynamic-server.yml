# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - dynamic-server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create and start virtual environment
        working-directory: dynamic-server
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        working-directory: dynamic-server
        run: |
          # Use the requirements.txt from the dynamic-server directory
          pip install -r dynamic-server/requirements.txt
        
      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Zip artifact for deployment
        # Change into dynamic-server, zip its contents, output to root
        run: (cd dynamic-server && zip ../release.zip -r .)

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip # Path relative to workspace root

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          # No path needed, downloads to the default workspace directory

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6F38B6E389C147F8BB3CE69C256C7AA6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEFDBE7E255B4631991E412FBA8274D9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0EB87D326A084DE89C2060B5D61BCE3C }}

      - name: 'Configure App Service for Log Streaming'
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Use the provided resource group name
            RESOURCE_GROUP="shop_assist_agent"
            
            # Remove any IP restrictions that might be blocking log streaming
            az webapp config access-restriction remove --resource-group $RESOURCE_GROUP --name dynamic-server --rule-name AllowAll || echo "No restrictions to remove"
            
            # Configure web app settings to enable logging
            az webapp config appsettings set --resource-group $RESOURCE_GROUP --name dynamic-server --settings WEBSITE_HTTPLOGGING_RETENTION_DAYS=7 SCM_LOGSTREAM_ENABLED=true
            
            # Add a delay before deployment to avoid SCM container restart conflicts
            echo "Waiting 30 seconds to avoid SCM container restart conflicts..."
            sleep 30

      - name: Set Startup Command
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Use the same resource group as before
            RESOURCE_GROUP="shop_assist_agent"
            # Set the startup command for the web app
            # IMPORTANT: Replace 'main:app' if your entry point file or Flask app variable is different
            az webapp config set --resource-group $RESOURCE_GROUP --name dynamic-server --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 main:app"
            
            # Add a longer delay before deployment to avoid SCM container restart conflicts
            echo "Waiting 120 seconds to allow the SCM container to stabilize..."
            sleep 120

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'dynamic-server'
          slot-name: 'Production'
          package: 'release.zip' # Deploy the zip file directly

