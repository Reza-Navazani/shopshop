# This workflow will build and deploy your Python application to Azure Web App
# For more information, see: https://docs.microsoft.com/azure/app-service/deploy-github-actions

name: Azure Web App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Azure App Service supports Python 3.11
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dynamic-server/requirements.txt
          
      - name: Build deployment package
        run: |
          mkdir -p deploy_package
          cp -r dynamic-server/* deploy_package/
          # Create a minimal requirements file for faster startup
          echo "gunicorn==21.2.0" > deploy_package/requirements.txt
          echo "flask>=3.0.0" >> deploy_package/requirements.txt
          echo "flask-cors>=4.0.0" >> deploy_package/requirements.txt
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy_package